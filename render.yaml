services:
  # 1. Backend Web Service (Python FastAPI)
  - type: web
    name: aeropulse-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: aeropulse-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aeropulse-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
